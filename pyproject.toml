[project]
name = "ciallobot"
version = "0.1.0"
description = "osu! Discord Bot"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "discord-py>=2.0",
    "aiohttp>=3.0",
    "python-dateutil>=2.8",
    "pycountry>=22.0",
    "aiofiles>=23.0",
    "rosu-pp-py>=1.0",
    "matplotlib>=3.0",
    "loguru>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]

[tool.pytest.ini_options]
pythonpath = ["."]
